services:
  - type: web
    name: societyflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: societyflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: societyflow-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGIN
        value: https://virendrabodele.github.io
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: LOGIN_RATE_LIMIT_MAX
        value: 10

  - type: redis
    name: societyflow-redis
    plan: free
    ipAllowList: []

databases:
  - name: societyflow-db
    databaseName: societyflow
    user: societyflow
    plan: free
