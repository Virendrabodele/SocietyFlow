services:
  # ──────────────────────────────────────────
  # Python / FastAPI Backend — Docker runtime
  # ──────────────────────────────────────────
  - type: web
    name: societyflow-api
    runtime: docker                        # ← KEY CHANGE: use Docker, not python
    plan: free
    rootDir: backend-python
    dockerfilePath: ./Dockerfile           # uses python:3.12-slim — no Rust issues
    healthCheckPath: /health/live
    envVars:
      # App
      - key: ENV
        value: production
      - key: PORT
        value: 10000

      # Database — Supabase
      # Set the real value in Render dashboard (don't hardcode password here)
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:YOUR_PASSWORD@db.ckabwxehfvfkzjureiog.supabase.co:5432/postgres?ssl=require

      # JWT Secrets — auto-generated by Render
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: 15
      - key: JWT_REFRESH_EXPIRE_DAYS
        value: 7

      # Redis — from the Render Redis service below
      - key: REDIS_URL
        fromService:
          name: societyflow-redis
          type: redis
          property: connectionString

      # CORS — your GitHub Pages frontend URL
      - key: CORS_ORIGINS
        value: '["https://virendrabodele.github.io", "http://localhost:5500"]'

      # Encryption key (32 chars) — auto-generated
      - key: ENCRYPTION_KEY
        generateValue: true

      # Email (optional)
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""

      # SMS / Twilio (optional)
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_PHONE_NUMBER
        value: ""

  # ──────────────────────────────────────────
  # Redis (free tier)
  # ──────────────────────────────────────────
  - type: redis
    name: societyflow-redis
    plan: free
    ipAllowList: []

  # No database block — using Supabase instead
