version: "3.9"

services:
  api:
    build: .
    container_name: societyflow-api
    ports:
      - "3000:3000"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://societyflow:password@db:5432/societyflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 3000 --reload

  db:
    image: postgres:16-alpine
    container_name: societyflow-db
    environment:
      POSTGRES_USER: societyflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: societyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U societyflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: societyflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
