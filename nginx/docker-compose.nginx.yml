version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: societyflow-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/societyflow.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app:/var/www/html:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
    networks:
      - societyflow-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    container_name: societyflow-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - societyflow-network

volumes:
  certbot-data:
    driver: local
  certbot-www:
    driver: local

networks:
  societyflow-network:
    external: true
